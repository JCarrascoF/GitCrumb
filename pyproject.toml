[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gitcrumb"
version = "0.1.0"
description = "Generates Git activity reports from commit history."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
gitcrumb = "gitcrumb.cli:main"
