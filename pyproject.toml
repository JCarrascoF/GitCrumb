[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gitrack"
version = "0.1.0"
description = "Genera informes de actividad Git a partir del historial de commits."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
gitrack = "gitrack.cli:main"
